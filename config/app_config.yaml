app:
  auto_save_records: true
  is_first_run: false
  show_welcome: true
database:
  path: ./data/records.db
file:
  export_path: ./exports
  import_path: ./imports
  supported_image_formats:
  - jpg
  - jpeg
  - png
  - bmp
  supported_video_formats:
  - mp4
  - avi
  - mov
logging:
  file: ./data/app.log
  level: INFO
recognition:
  analysis_fps: 3.0
  confidence_threshold: 0.75
  max_analysis_frames: 1500
  model_path: ./models/pose_model.pth
  sequence_length: 8
  target_fps: 30
speech:
  enabled: false
  language: zh_CN
  speed: 1.0
  voice: female_warm
  volume: 0.8
